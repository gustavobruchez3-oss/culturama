<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesquisa Culturama</title>
  </head>
  <body>
    <header>
      <h1>Pesquisa online</h1>
    </header>

    <section>
      <form action="" method="get">
        <fieldset>
          <legend>Dados pessoais</legend>

          <label for="userName">Nome: </label>
          <input type="text" name="userName" id="userName" required />
          <br />

          <label for="userAge">Idade: </label>
          <input
            id="userAge"
            type="number"
            name="userAge"
            max="100"
            min="12"
            value="12"
            required
          />
          <br />

          <label for="userBirthDate">Data de nascimento: </label>
          <input type="date" name="userBirthDate" id="userBirthDate" />
          <br />

          <label for="userEmail">E-mail: </label>
          <input type="email" name="userEmail" id="userEmail" required />
          <br />

          <label for="userPhoneNumber">Telefone: </label>
          <input
            type="tel"
            id="userPhoneNumber"
            name="userPhoneNumber"
            pattern="[0-9]{11}"
            placeholder="Ex: 00000000000"
          />
          <br />

          <label for="userImage">Upload de foto: </label>
          <input type="file" name="userImage" id="userImage" accept="image/*" />
          <br />
        </fieldset>

        <fieldset>
          <legend>Perfil</legend>

          <p>Gênero:</p>
          <input
            id="feminino"
            type="radio"
            name="userGender"
            value="feminino"
          />
          <label for="feminino">Feminino</label>

          <input
            id="masculino"
            type="radio"
            name="userGender"
            value="masculino"
          />
          <label for="masculino">Masculino</label>

          <input id="outro" type="radio" name="userGender" value="outro" />
          <label for="outro">Outro</label>
          <input id="outro" type="text" name="userGender" placeholder="Especifique" />

          <input
            id="naoInformado"
            type="radio"
            name="userGender"
            value="naoInformado"
          />
          <label for="naoInformado">Prefiro não informar</label>

          <br />

          <label for="maritalStatus">Estado civil:</label>
          <select name="maritalStatus">
            <option value="naoInformado" selected hidden>Selecione</option>
            <option value="solteiro">Solteiro</option>
            <option value="casado">Casado</option>
            <option value="viuvo">Viúvo</option>
            <option value="divorciado">Divorciado</option>
            <option value="uniaoEstavel">União estável</option>
          </select>

          <br />

          <label for="userState">Estado</label>
          <select name="userState" required>
            <option value="" selected hidden>Selecione</option>
            <option value="acre">Acre</option>
            <option value="alagoas">Alagoas</option>
            <option value="amapa">Amapá</option>
            <option value="amazonas">Amazonas</option>
            <option value="bahia">Bahia</option>
            <option value="ceara">Ceará</option>
            <option value="distritoFederal">Distrito Federal</option>
            <option value="espiritoSanto">Espirito Santo</option>
            <option value="goias">Goiás</option>
            <option value="maranhao">Maranhão</option>
            <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
            <option value="matoGrosso">Mato Grosso</option>
            <option value="minasGerais">Minas Gerais</option>
            <option value="para">Pará</option>
            <option value="paraiba">Paraíba</option>
            <option value="parans">Paraná</option>
            <option value="pernambuco">Pernambuco</option>
            <option value="piaui">Piauí</option>
            <option value="rioDeJaneiro">Rio de Janeiro</option>
            <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
            <option value="rioGrandeDoSul">Rio Grande do Sul</option>
            <option value="rondonia">Rondônia</option>
            <option value="roraima">Roraima</option>
            <option value="santaCatarina">Santa Catarina</option>
            <option value="saoPaulo">São Paulo</option>
            <option value="sergipe">Sergipe</option>
            <option value="tocantins">Tocantins</option>
          </select>

          <br />

          <label for="userCity">Cidade:</label>
          <input id="userCity" name="userCity" type="text" />
        </fieldset>

        <fieldset>
          <legend>Hábitos</legend>

          <p>Redes Sociais:</p>
          <input id="facebook" type="checkbox" name="social" value="facebook" />
          <label for="facebook">Facebook</label>

          <input id="whatsapp" type="checkbox" name="social" value="whatsapp" />
          <label for="whatsapp">Whatsapp</label>

          <input id="X" type="checkbox" name="social" value="twitter" />
          <label for="twitter">Twitter</label>

          <input id="youtube" type="checkbox" name="social" value="youtube" />
          <label for="youtube">Youtube</label>

          <br />

          <label for="musicalStyle">Estilo Musical:</label>
          <input id="musicalStyle" name="usermusicalStyle" type="text" list="styleType"/> 
          <datalist id="styleType">
            <option value="Rock" />
            <option value="Pop" />
            <option value="Eletrônica" />
            <option value="Samba" />
            <option value="Sertanejo" />
          </datalist>
          <br>

          <label for="favoriteColor">Cor Favorita:</label>
          <input id="favoriteColor" name="userFavoriteColor" type="color" />
          <br>

         

          
        </fieldset>
        <fieldset>
  <legend>Comentários</legend>
  <p>O que você acha da qualidade do nosso serviço?</p>

  
  <input type="radio" name="userOpinion" value="otimo" id="otimo" />
  <label for="otimo">Ótimo</label></br>

  
  <input type="radio" name="userOpinion" value="bom" id="bom" />
  <label for="bom">Bom</label> </br> 

 
  <input type="radio" name="userOpinion" value="regular" id="regular" />
  <label for="regular">Regular</label></br>
  
 
  <input type="radio" name="userOpinion" value="ruim" id="ruim" />
  <label for="ruim">Ruim</label> </br>

  
  <input type="radio" name="userOpinion" value="pessimo" id="pessimo" />
  <label for="pessimo">Péssimo</label></br>

  
  <br /><br />

  <p>Você recomendaria nosso serviço?</p>
  <textarea name="userComment" id="userComment" cols="50" rows="4" placeholder="Deixe sua indicação aqui..."></textarea>
</fieldset>

          
       

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
      </form>
    </section>
  </body>
</html>
