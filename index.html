<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa online</h1>
    </header>
    <section>
        <form action="" method="get">
            <fieldset>
                <legend>Informações pessoais</legend>
                <label for="userName">Nome:</label>
                <input type="text"  name="userName" required>
                <br>
                <label for="userAge">Anos:</label>
                <input type="number" name="userAge" required min="12" max="100">
                <br>
                <label for="userBirthDate">Nascimento:</label>
                <input type="date" name="userBirthDate" >
                <br>
                <label for="userEmail">E-mail:</label>
                <input type="email" name="userEmail" required>
                <br>
                <label for="userPhone">Telefone:</label>
                <input type="tel" name="userPhone" pattern="[0-9]{11}" placeholder="(99) 99999-9999">
                <br>
                <label for="userImage">Upload de foto:</label>
                <input type="file" name="userImage" accept="image/*">
            </fieldset>

            <button type="submit">Enviar</button>



        </form>
    </section>

</body>
</html>
